name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install deps (for peer-dep smoke test)
        run: pnpm install --frozen-lockfile
      - name: Syntax check (node --check)
        run: |
          shopt -s globstar
          for f in src/**/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
        shell: bash
      - name: Import smoke test
        run: node -e "import('./src/index.mjs').then(m => { if (!m.captureScreenshots || !m.inspectLayout || !m.compareScreenshots) throw new Error('missing exports'); console.log('exports ok'); })"
      - name: Unit tests
        run: pnpm test
